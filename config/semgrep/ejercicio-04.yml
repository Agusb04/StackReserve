# Reglas estáticas incrementales (ejercicio-04): mismo criterio base que ejercicio-03.
rules:
  - id: tpi-ej04-import-star
    languages: [java]
    severity: ERROR
    message: Evitar importaciones wildcard.
    pattern: import $MOD.*;

  - id: tpi-ej04-return-null
    languages: [java]
    severity: ERROR
    message: No devolver null como implementación final en código de dominio/servicio.
    pattern: return null;
